# Pre-commit hooks for dotfiles repository
# Install: pre-commit install
# Run manually: pre-commit run --all-files
#
# File selection uses identify tags (types/exclude_types) instead of path
# regexes. Submodule contents (oh-my-zsh, powerlevel10k, vendored plugins,
# vim-colors-solarized) are ignored by pre-commit automatically, so no manual
# excludes are needed.

repos:
  # Shell script linting and formatting
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        name: ShellCheck - Shell script linter
        args: [--severity=warning, --shell=bash]
        types: [shell]
        exclude_types: [zsh] # shellcheck does not support zsh

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.1-1
    hooks:
      - id: shfmt
        name: shfmt - Shell script formatter
        args: [-i, '2', -ci, -w]
        types: [shell]

  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        name: Trim trailing whitespace
      - id: end-of-file-fixer
        name: Ensure files end with newline
      - id: check-yaml
        name: Check YAML syntax
      - id: check-added-large-files
        name: Check for large files
        args: [--maxkb=500]
      - id: check-case-conflict
        name: Check for case conflicts
      - id: check-merge-conflict
        name: Check for merge conflicts
      - id: check-executables-have-shebangs
        name: Check executables have shebangs
      - id: mixed-line-ending
        name: Check for mixed line endings
        args: [--fix=lf]
      - id: detect-private-key
        name: Detect private keys
